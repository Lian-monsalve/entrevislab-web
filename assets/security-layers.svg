<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Defensa en profundidad de EntrevisLab</title>
  <desc id="d">Cuatro capas: cabeceras Edge y CSP, DOM Zero-XSS, integridad secuencial djb2 y persistencia 100% local.</desc>
  <!-- Copyright (c) 2026 Lian Monsalve (EntrevisLab). Paleta oficial: DESIGN.md -->
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="300" y="40" width="860" height="216" rx="12"/></clipPath>
  </defs>
  <style>
    .h { font: 800 13px 'JetBrains Mono',Consolas,monospace; fill: #CBD5E1; letter-spacing: 1px; }
    .t { font: 700 16px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #F8FAFC; }
    .s { font: 500 12.5px 'JetBrains Mono',Consolas,monospace; fill: #CBD5E1; }
    .layer { opacity: 0; animation: slide .8s cubic-bezier(.16,1,.3,1) forwards; }
    .l1 { animation-delay: .1s } .l2 { animation-delay: .3s } .l3 { animation-delay: .5s } .l4 { animation-delay: .7s }
    .beam { animation: sweep 3.5s ease-in-out infinite; }
    .shield { transform-box: fill-box; transform-origin: center; animation: breathe 3s ease-in-out infinite; }
    @keyframes slide { from { opacity: 0; transform: translateX(-24px) } to { opacity: 1; transform: translateX(0) } }
    @keyframes sweep { 0% { transform: translateX(-200px) } 100% { transform: translateX(900px) } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>

  <rect width="1200" height="280" rx="20" fill="#060A12"/>
  <text x="40" y="30" class="h">DEFENSA EN PROFUNDIDAD · DEVSECOPS</text>

  <!-- Escudo -->
  <g class="shield" transform="translate(70 60)">
    <path d="M90 0 L170 30 V95 C170 140 135 172 90 190 C45 172 10 140 10 95 V30 Z" fill="#0D1526" stroke="#2563EB" stroke-width="3"/>
    <path d="M90 22 L150 44 V95 C150 128 124 152 90 166 C56 152 30 128 30 95 V44 Z" fill="none" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <rect x="66" y="88" width="48" height="38" rx="7" fill="#10B981"/>
    <path d="M76 88 V76 a14 14 0 0 1 28 0 V88" fill="none" stroke="#10B981" stroke-width="5"/>
    <circle cx="90" cy="105" r="5" fill="#060A12"/>
  </g>

  <!-- Capas -->
  <g class="layer l1"><rect x="300" y="40" width="860" height="48" rx="12" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="324" y="70" class="t">01 · Edge Cloudflare</text><text x="560" y="70" class="s">_headers · CSP strict · X-Frame-Options: DENY · Permissions-Policy</text></g>
  <g class="layer l2"><rect x="300" y="96" width="860" height="48" rx="12" fill="#16213A" stroke="#2563EB" stroke-width="1.5"/>
    <text x="324" y="126" class="t">02 · DOM Zero-XSS</text><text x="560" y="126" class="s">.textContent · createElementNS · 0 innerHTML · 0 eval (SAST)</text></g>
  <g class="layer l3"><rect x="300" y="152" width="860" height="48" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
    <text x="324" y="182" class="t">03 · Integridad secuencial</text><text x="560" y="182" class="s">isPhaseUnlocked · validateRealEvidence · hash djb2</text></g>
  <g class="layer l4"><rect x="300" y="208" width="860" height="48" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="324" y="238" class="t">04 · Privacidad local</text><text x="560" y="238" class="s">localStorage · Web Speech API local · sin backend ni telemetría</text></g>

  <!-- Haz de escaneo -->
  <g clip-path="url(#clip)"><rect class="beam" x="300" y="40" width="160" height="216" fill="url(#scan)"/></g>

  <!-- Indicadores de verificación -->
  <g fill="#10B981">
    <circle cx="1136" cy="64" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="120" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="176" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="232" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
