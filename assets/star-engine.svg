<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Motor determinista S-T-A-R y Radar de 5 ejes</title>
  <desc id="d">Distribución STAR 10/10/50/30 y evolución del radar de competencias del diagnóstico a la simulación real.</desc>
  <!-- Copyright (c) 2026 Lian Monsalve (EntrevisLab). Paleta oficial: DESIGN.md -->
  <style>
    .h { font: 800 13px 'JetBrains Mono',Consolas,monospace; fill: #CBD5E1; letter-spacing: 1px; }
    .big { font: 800 30px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #F8FAFC; }
    .lbl { font: 600 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #CBD5E1; }
    .ax { font: 700 12px 'JetBrains Mono',Consolas,monospace; fill: #CBD5E1; }
    .lg { font: 700 12px 'JetBrains Mono',Consolas,monospace; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 3.6s cubic-bezier(.16,1,.3,1) infinite; }
    .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
    .spin { transform-origin: 170px 150px; animation: spin 18s linear infinite; }
    @keyframes grow { 0% { transform: scaleX(0) } 35%, 85% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="300" rx="20" fill="#060A12"/>

  <!-- Donut STAR (pathLength=100) -->
  <g>
    <text x="40" y="38" class="h">ESTRUCTURA S-T-A-R</text>
    <circle cx="170" cy="150" r="96" fill="none" stroke="#CBD5E1" stroke-opacity="0.12" stroke-dasharray="2 6" class="spin"/>
    <g transform="rotate(-90 170 150)" fill="none" stroke-width="22">
      <circle cx="170" cy="150" r="70" stroke="#16213A"/>
      <circle cx="170" cy="150" r="70" pathLength="100" stroke="#38BDF8" stroke-dasharray="0 100" stroke-dashoffset="0">
        <animate attributeName="stroke-dasharray" values="0 100;9.4 90.6;9.4 90.6" keyTimes="0;0.15;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="150" r="70" pathLength="100" stroke="#0284C7" stroke-dasharray="0 100" stroke-dashoffset="-10">
        <animate attributeName="stroke-dasharray" values="0 100;0 100;9.4 90.6;9.4 90.6" keyTimes="0;0.15;0.3;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="150" r="70" pathLength="100" stroke="#818CF8" stroke-dasharray="0 100" stroke-dashoffset="-20">
        <animate attributeName="stroke-dasharray" values="0 100;0 100;49.4 50.6;49.4 50.6" keyTimes="0;0.3;0.55;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="150" r="70" pathLength="100" stroke="#10B981" stroke-dasharray="0 100" stroke-dashoffset="-70">
        <animate attributeName="stroke-dasharray" values="0 100;0 100;29.4 70.6;29.4 70.6" keyTimes="0;0.55;0.75;1" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="170" y="148" text-anchor="middle" class="big">STAR</text>
    <text x="170" y="170" text-anchor="middle" class="ax">100 pts</text>
  </g>

  <!-- Barras de ponderación -->
  <g transform="translate(320 80)">
    <text x="0" y="-14" class="h">PONDERACIÓN DEL MOTOR LÉXICO</text>
    <text x="0" y="16" class="lbl">[S] Situación · 10%</text>
    <rect x="170" y="4" width="200" height="14" rx="7" fill="#16213A"/>
    <rect class="bar" x="170" y="4" width="40" height="14" rx="7" fill="#38BDF8"/>
    <text x="0" y="56" class="lbl">[T] Tarea · 10%</text>
    <rect x="170" y="44" width="200" height="14" rx="7" fill="#16213A"/>
    <rect class="bar b2" x="170" y="44" width="40" height="14" rx="7" fill="#0284C7"/>
    <text x="0" y="96" class="lbl">[A] Acción 1.ª pers. · 50%</text>
    <rect x="170" y="84" width="200" height="14" rx="7" fill="#16213A"/>
    <rect class="bar b3" x="170" y="84" width="200" height="14" rx="7" fill="#818CF8"/>
    <text x="0" y="136" class="lbl">[R] Resultado · 30%</text>
    <rect x="170" y="124" width="200" height="14" rx="7" fill="#16213A"/>
    <rect class="bar b4" x="170" y="124" width="120" height="14" rx="7" fill="#10B981"/>
    <text x="0" y="176" class="lbl" fill="#F59E0B" style="fill:#F59E0B">Muletillas · penalización máx. −15</text>
  </g>

  <!-- Radar 5 ejes con morfología SMIL -->
  <g transform="translate(920 160)">
    <text x="-200" y="-122" class="h">RADAR DE 5 EJES · DIAGNÓSTICO → SIMULACIÓN</text>
    <polygon points="0,-80 76.09,-24.72 47.02,64.72 -47.02,64.72 -76.09,-24.72" fill="#0D1526" stroke="#CBD5E1" stroke-opacity="0.25"/>
    <polygon points="0,-40 38.04,-12.36 23.51,32.36 -23.51,32.36 -38.04,-12.36" fill="none" stroke="#CBD5E1" stroke-opacity="0.15"/>
    <path d="M0 0L0 -80M0 0L76.09 -24.72M0 0L47.02 64.72M0 0L-47.02 64.72M0 0L-76.09 -24.72" stroke="#CBD5E1" stroke-opacity="0.15"/>
    <polygon points="0,-36 26.63,-8.65 14.11,19.42 -25.86,35.6 -30.44,-9.89" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polygon points="0,-36 26.63,-8.65 14.11,19.42 -25.86,35.6 -30.44,-9.89" fill="#10B981" fill-opacity="0.22" stroke="#10B981" stroke-width="2.5">
      <animate attributeName="points" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.4;0.8;1" keySplines=".16 1 .3 1;0 0 1 1;.7 0 .84 0"
        values="0,-36 26.63,-8.65 14.11,19.42 -25.86,35.6 -30.44,-9.89;0,-68 68.48,-22.25 37.62,51.78 -35.27,48.54 -66.96,-21.75;0,-68 68.48,-22.25 37.62,51.78 -35.27,48.54 -66.96,-21.75;0,-36 26.63,-8.65 14.11,19.42 -25.86,35.6 -30.44,-9.89"/>
    </polygon>
    <text x="0" y="-90" text-anchor="middle" class="ax">Claridad</text>
    <text x="86" y="-28" class="ax">STAR</text>
    <text x="54" y="84" class="ax">Métricas</text>
    <text x="-54" y="84" text-anchor="end" class="ax">Tiempo</text>
    <text x="-86" y="-28" text-anchor="end" class="ax">Seguridad</text>
    <g transform="translate(140 -40)">
      <rect width="12" height="12" rx="3" fill="#F59E0B"/><text x="18" y="11" class="lg" fill="#F59E0B">Diagnóstico</text>
      <rect y="22" width="12" height="12" rx="3" fill="#10B981"/><text x="18" y="33" class="lg" fill="#10B981">Simulación</text>
    </g>
  </g>
</svg>
