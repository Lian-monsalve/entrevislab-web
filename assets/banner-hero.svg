<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">EntrevisLab — Banner principal animado</title>
  <desc id="d">Plataforma de entrenamiento adaptativo para entrevistas laborales con motor determinista S-T-A-R. Paleta Deep Navy y Metallic Silver.</desc>
  <!-- Copyright (c) 2026 Lian Monsalve (EntrevisLab). Paleta oficial: DESIGN.md -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A12"/>
      <stop offset="0.6" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#16213A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CBD5E1" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .title { font: 800 64px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #F8FAFC; letter-spacing: -2px; }
    .sub { font: 500 19px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #CBD5E1; }
    .chip { font: 700 13px 'JetBrains Mono',Consolas,monospace; }
    .fade { opacity: 0; animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) forwards; }
    .f1 { animation-delay: .1s } .f2 { animation-delay: .35s } .f3 { animation-delay: .6s }
    .f4 { animation-delay: .75s } .f5 { animation-delay: .9s } .f6 { animation-delay: 1.05s }
    .spark { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3.2s ease-in-out infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .n2 { animation-delay: .3s } .n3 { animation-delay: .6s } .n4 { animation-delay: .9s }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes draw { 0% { stroke-dashoffset: 900 } 55%, 80% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -900 } }
    @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.35) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="980" cy="160" r="220" fill="url(#glow)">
    <animate attributeName="r" values="200;235;200" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Isotipo -->
  <g transform="translate(60 92) scale(2.1)" class="fade f1">
    <rect x="3" y="3" width="58" height="58" rx="15" fill="#0F172A" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M15 22C15 17.58 18.58 14 23 14H41C45.42 14 49 17.58 49 22V35C49 39.42 45.42 43 41 43H29L20 50V43H23C18.58 43 15 39.42 15 35V22Z" fill="rgba(56,189,248,0.1)" stroke="#CBD5E1" stroke-width="2.2"/>
    <polyline points="23,32 30,24 37,31 43,22" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
    <circle class="node" cx="23" cy="32" r="3.2" fill="#38BDF8"/>
    <circle class="node n2" cx="30" cy="24" r="3.2" fill="#E2E8F0"/>
    <circle class="node n3" cx="37" cy="31" r="3.2" fill="#818CF8"/>
    <circle class="node n4" cx="43" cy="22" r="3.5" fill="#10B981"/>
  </g>

  <text x="230" y="140" class="title fade f2">EntrevisLab</text>
  <text x="232" y="178" class="sub fade f3">Entrenamiento adaptativo para entrevistas laborales · Motor determinista S-T-A-R</text>

  <!-- Chips tecnológicos -->
  <g class="fade f4" transform="translate(232 206)">
    <rect width="196" height="32" rx="16" fill="#0D1526" stroke="#2563EB" stroke-width="1.5"/>
    <text x="98" y="21" text-anchor="middle" class="chip" fill="#93C5FD">ZERO-BUILD ES2022</text>
  </g>
  <g class="fade f5" transform="translate(440 206)">
    <rect width="168" height="32" rx="16" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
    <text x="84" y="21" text-anchor="middle" class="chip" fill="#10B981">CSP STRICT · 0 XSS</text>
  </g>
  <g class="fade f6" transform="translate(620 206)">
    <rect width="176" height="32" rx="16" fill="#0D1526" stroke="#818CF8" stroke-width="1.5"/>
    <text x="88" y="21" text-anchor="middle" class="chip" fill="#818CF8">100% CLIENT-SIDE</text>
  </g>

  <!-- Sparkline de progreso Diagnóstico -> Simulación -->
  <g transform="translate(860 70)">
    <rect width="290" height="180" rx="18" fill="#0D1526" fill-opacity="0.85" stroke="#CBD5E1" stroke-opacity="0.18"/>
    <text x="20" y="32" class="chip" fill="#CBD5E1">PROGRESO STAR · 0-100</text>
    <path d="M20 150H270M20 110H270M20 70H270" stroke="#CBD5E1" stroke-opacity="0.08"/>
    <path id="sparkPath" class="spark" d="M20 150 L65 138 L110 128 L155 104 L200 88 L235 66 L270 52" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="6" fill="#10B981">
      <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear">
        <mpath href="#sparkPath"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="270" y="170" text-anchor="end" class="chip" fill="#10B981">+42 pts
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Separador inferior animado -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#line)" opacity="0.85"/>
  <rect x="-200" y="314" width="200" height="6" fill="#F8FAFC" opacity="0.55">
    <animate attributeName="x" from="-200" to="1200" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
